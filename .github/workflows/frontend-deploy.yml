name: Deploy Frontend

on:
  push:
    branches: [ main ]
    paths:
      - 'front-end/**'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      
      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '18'
          
      - name: Install Dependencies
        run: |
          cd front-end
          npm ci
          
      - name: Build
        run: |
          cd front-end
          npm run build
        env:
          VITE_REACT_APP_API_URL: ${{ secrets.PROD_API_URL }}
          
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/projet/frontend
            rm -rf dist/*
            mkdir -p dist
            
      - name: Copy build files
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "front-end/dist/*"
          target: "/var/www/projet/frontend/dist"
          strip_components: 2