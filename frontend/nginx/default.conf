server {
    listen 80;
    server_name localhost;  # Ou ton nom de domaine

    # Location pour servir les fichiers statiques de l'application frontend
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;  # S'assurer que l'index.html est servi pour toute route
    }

    # Optional: Ajouter des headers CORS pour l'API si nécessaire
    add_header 'Access-Control-Allow-Origin' '*';
    add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE';
    add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
}
