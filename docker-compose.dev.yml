version: '3.8'

services:
  backend-dev:
    build:
      dockerfile: Dockerfile.dev
      context: ./backendProject
    # environment:
    #   - ENV=${ENV}
    #   - DATABASE_HOST=db
    #   - DATABASE_USER=${DATABASE_USER}
    #   - DATABASE_PASSWORD=${DATABASE_PASSWORD}
    #   - DATABASE_NAME=${DATABASE_NAME}
    env_file:
      - .env.dev
    volumes:
      - ./backendProject:/app
    ports:
      - "8000:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    # environment:
    #   - ENV=${ENV}
    #   - DATABASE_HOST=db
    #   - DATABASE_USER=${DATABASE_USER}
    #   - DATABASE_PASSWORD=${DATABASE_PASSWORD}
    #   - DATABASE_NAME=${DATABASE_NAME}
    env_file:
      - .env.dev
    volumes:
      - ./frontend:/app
      -  /app/node_modules # Commenter cette ligne entraine souvent les problemes de dependance lie au @rollup/rollup-linux-x64-gnu.
    ports:
      - "5173:5173"
    networks:
      - app-network

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD} 
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
