version: '3.8'

services:
  web:
    container_name: api
    restart: always
    build: 
      context: .
      dockerfile: Dockerfil
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/uploads
    env_file:
      - .env.prod
    depends_on:
      - db
      - redis

  nginx:
    container_name: nginx
    restart: always
    image: nginx:latest
    volumes:
      - ./nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles
      - media_volume:/app/uploads
      - /etc/letsencrypt:/etc/letsencrypt
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web

  db:
    container_name: postgres
    image: postgres:13
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    env_file:
      - .env.prod
    restart: always

  redis:
    container_name: redis
    image: redis:7.4
    restart: always

volumes:
  postgres_data:
  static_volume:
  media_volume: 