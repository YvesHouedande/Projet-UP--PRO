version: '3.8'

services:
  backend:
    build:
      dockerfile: Dockerfile
      context: ./backendProject
    # environment:
    #   - ENV=${ENV}
    #   - DATABASE_HOST=db
    #   - DATABASE_USER=${DATABASE_USER}
    #   - DATABASE_PASSWORD=${DATABASE_PASSWORD}
    #   - DATABASE_NAME=${DATABASE_NAME}
    env_file:
      - .env
    # volumes:
    #   - ./backendProject:/app
    ports:
      - "2001:80"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    # environment:
    #   - ENV=${ENV}
    #   - FRONTEND_PORT=${FRONTEND_PORT}
    env_file:
      - .env
    # volumes:
    #   - ./frontend:/app
    #   -  /app/node_modules
    ports:
      # - "${FRONTEND_PORT}:${FRONTEND_PORT}"
      - "2000:80"
    networks:
      - app-network

  db:
    image: postgres:13
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD} 
      POSTGRES_DB: ${DATABASE_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
